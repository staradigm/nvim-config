name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      # Treat the checkout as a real ~/.config/nvim so runtimepath is correct.
      - name: Link config into XDG_CONFIG_HOME
        run: |
          mkdir -p "$HOME/.config"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.config/nvim"
          nvim --version | head -1

      - name: Install plugins (Lazy sync)
        run: nvim --headless "+Lazy! sync" +qa

      - name: Verify config loads
        run: nvim --headless "+luafile lua/verify.lua" +qa

      - name: Verify startup is clean
        run: nvim --headless +qa 2>&1 | grep -iE "error|exception" || echo "clean startup"